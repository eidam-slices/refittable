[project]
name = "refittable"
description = "Nástroj pro úpravu a export rozvrhů ze Sirius API (FIT ČVUT)"
readme = "README.md"

version = "0.0.0"

requires-python = ">=3.12"
dependencies = [
    "holidays>=0.107",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py312"

[tool.ruff.format]
skip-magic-trailing-comma = false
quote-style = "double"
indent-style = "space"
line-ending = "lf"
